<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="高さ出し" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>オートレベル高さ出し</title>
    <script type="module" crossorigin src="./assets/index-DsRyfXpr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BKQpiv3c.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="eyebrow">AUTO LEVEL</p>
          <h1>高さ出し</h1>
        </div>
        <span class="unit-badge">単位 mm</span>
      </header>

      <section class="reference-card" aria-labelledby="reference-heading">
        <div class="section-topline"><h2 id="reference-heading">基準墨のSL値</h2><span class="step">01</span></div>
        <div class="signed-input">
          <div class="sign-control" role="group" aria-label="基準墨の符号">
            <button id="reference-plus" type="button" data-sign="plus">＋</button>
            <button id="reference-minus" type="button" data-sign="minus">－</button>
          </div>
          <span class="sl-prefix">SL</span>
          <input id="reference-mm" class="number-input" type="text" inputmode="numeric" autocomplete="off" aria-label="基準墨の高さ、整数mm" placeholder="1000" />
          <span class="input-unit">mm</span>
        </div>
        <p id="reference-error" class="field-error" role="alert"></p>
      </section>

      <section class="measure-card" aria-labelledby="measure-heading">
        <div class="section-topline"><h2 id="measure-heading">水平線の測定</h2><span class="step">02</span></div>
        <p class="field-label">水平線は基準墨より</p>
        <div class="direction-control" role="group" aria-label="水平線の方向">
          <button id="direction-up" class="direction-button" type="button" aria-pressed="true"><span class="direction-arrow">↑</span><span>基準墨より上</span></button>
          <button id="direction-down" class="direction-button" type="button" aria-pressed="false"><span class="direction-arrow">↓</span><span>基準墨より下</span></button>
        </div>
        <label class="field-label distance-label" for="distance-mm">基準墨からの距離</label>
        <div class="distance-input-wrap"><input id="distance-mm" class="distance-input" type="text" inputmode="numeric" autocomplete="off" aria-describedby="distance-error" placeholder="0" /><span>mm</span></div>
        <p id="distance-error" class="field-error" role="alert"></p>
      </section>

      <section class="target-card" aria-labelledby="target-heading">
        <div class="section-topline"><h2 id="target-heading">出したい高さ</h2><span class="step">03</span></div>
        <div class="preset-control" role="group" aria-label="目標高さのプリセット">
          <button type="button" data-target="40" aria-pressed="true">SL＋40</button>
          <button type="button" data-target="0" aria-pressed="false">SL±0</button>
          <button type="button" data-target="100" aria-pressed="false">SL＋100</button>
          <button type="button" data-target="custom" aria-pressed="false">自由入力</button>
        </div>
        <div id="custom-target" class="custom-target" hidden>
          <div class="signed-input">
            <div class="sign-control" role="group" aria-label="目標SLの符号">
              <button id="target-plus" type="button" data-sign="plus">＋</button>
              <button id="target-minus" type="button" data-sign="minus">－</button>
            </div>
            <span class="sl-prefix">SL</span>
            <input id="target-mm" class="number-input" type="text" inputmode="numeric" autocomplete="off" aria-label="目標高さ、整数mm" placeholder="高さ" />
            <span class="input-unit">mm</span>
          </div>
          <p id="target-error" class="field-error" role="alert"></p>
        </div>
      </section>

      <section class="result-card" aria-labelledby="result-heading" aria-live="polite">
        <div class="result-heading-row"><h2 id="result-heading">子機の位置（サンギ下端から）</h2><span id="result-target">目標 SL＋40</span></div>
        <div id="result-main" class="result-main is-pending">基準墨を入力</div>
        <p id="result-guide" class="result-guide"></p>
        <p id="result-current" class="result-current">現在の水平線：—</p>
      </section>
      <section class="trace-card" aria-labelledby="trace-heading">
        <h2 id="trace-heading">計算の確認</h2>
        <p id="trace-text">基準墨と測定距離を入力すると、計算過程を表示します。</p>
      </section>
      <p class="footnote">数値はすべて整数mm。入力内容は保存しません。</p>
    </main>
  </body>
</html>
